name: HoYoLAB Daily Check-In

on:
  schedule:
    # Runs everyday at 06:00 UTC (14:00 UTC+8 / 22:00 PST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  daily-claim:
    name: Claim Daily Rewards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Daily Check-In
        env:
          HOYOLAB_CONFIG_JSON: ${{ secrets.HOYOLAB_CONFIG_JSON }}
          HOYOLAB_ACCOUNTS: ${{ secrets.HOYOLAB_ACCOUNTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING_USER_ID: ${{ secrets.DISCORD_PING_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: pnpm start
